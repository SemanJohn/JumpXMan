<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JumpXMan - Pengira Lompatan AI</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- CSS Style -->
  <link rel="stylesheet" href="style.css">

  <!-- MediaPipe Holistic & Drawing Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header Utama -->
    <header class="app-header">
      <div class="logo">
        <span class="icon">🏃</span>
        <h1>JumpXMan <span class="badge">AI Pose</span></h1>
      </div>
      <div class="header-actions">
        <button id="pwa-install-btn" class="btn-install" style="display:none;">📱 Pasang App</button>
        <button id="open-settings-btn" class="icon-btn" aria-label="Tetapan">⚙️</button>
      </div>
    </header>

    <!-- Paparan Utama Kamera -->
    <main class="viewport-section">
      <div class="video-wrapper">
        <video id="webcam" playsinline style="display:none;"></video>
        <canvas id="output_canvas"></canvas>

        <!-- Overlay HUD Stats -->
        <div class="hud-overlay">
          <div class="stat-card count-card">
            <span class="label">LOMPATAN</span>
            <span id="jump-count" class="value">0</span>
          </div>
          <div class="stat-card status-card">
            <span class="label">STATUS</span>
            <span id="jump-status" class="status-badge ready">SEDIA</span>
          </div>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdown-overlay" class="countdown-overlay" style="display:none;">
          <span id="countdown-number">3</span>
        </div>

        <!-- Gesture Toast Overlay -->
        <div id="gesture-toast" class="gesture-toast" style="display:none;">
          <span id="gesture-text">✋ Tunjuk Tapak Tangan...</span>
        </div>

        <!-- Meter Ketinggian Lompatan Live -->
        <div class="jump-meter-container">
          <div id="jump-meter-bar" class="jump-meter-bar"></div>
        </div>

        <!-- Full Body Warning Overlay -->
        <div id="calibration-msg" class="calibration-overlay">
          <p id="calibration-text">🧍 Pastikan badan dan kaki kelihatan di kamera.</p>
        </div>
      </div>
    </main>

    <!-- Bar Kawalan Utama Ringkas -->
    <section class="main-controls">
      <button id="start-btn" class="btn btn-primary">▶️ Mula</button>
      <button id="reset-btn" class="btn btn-secondary">🔄 Reset</button>
      <button id="settings-btn" class="btn btn-outline">⚙️ Tetapan</button>
    </section>

    <!-- Modal Pop-Up Tetapan -->
    <div id="settings-modal" class="modal-backdrop">
      <div class="modal-content">
        <div class="modal-header">
          <h2>⚙️ Tetapan JumpXMan</h2>
          <button id="close-settings-btn" class="close-btn">&times;</button>
        </div>

        <div class="modal-body">
          <div class="setting-row">
            <label for="start-mode-select" class="setting-label">🚀 Cara Mula Sesi:</label>
            <select id="start-mode-select" class="select-input">
              <option value="timer_5" selected>Timer 5 Saat</option>
              <option value="timer_10">Timer 10 Saat</option>
              <option value="timer_3">Timer 3 Saat</option>
              <option value="motion">Motion (Tapak Tangan ✋ & Genggam ✊)</option>
            </select>
          </div>

          <div class="setting-row">
            <label for="camera-select" class="setting-label">📷 Pilihan Kamera:</label>
            <select id="camera-select" class="select-input">
              <option value="">Memuatkan kamera...</option>
            </select>
          </div>

          <div class="setting-row">
            <label for="sensitivity-select" class="setting-label">⚡ Kepekaan Lompatan:</label>
            <select id="sensitivity-select" class="select-input">
              <option value="high">Tinggi (Lompatan Kecil)</option>
              <option value="medium" selected>Sederhana (Disyorkan)</option>
              <option value="low">Rendah (Lompatan Tinggi)</option>
            </select>
          </div>

          <div class="setting-row">
            <span class="setting-label">🩻 Paparan Skeleton:</span>
            <label class="toggle-switch">
              <input type="checkbox" id="skeleton-toggle" checked>
              <span class="slider"></span>
            </label>
          </div>

          <hr class="divider">

          <div class="setting-row">
            <span class="setting-label">🥁 Bunyi Metronome:</span>
            <label class="toggle-switch">
              <input type="checkbox" id="metronome-toggle">
              <span class="slider"></span>
            </label>
          </div>

          <div class="setting-row metronome-config">
            <label for="bpm-slider" class="setting-label">⏱️ Tempo Metronome (BPM):</label>
            <div class="bpm-controls">
              <input type="range" id="bpm-slider" min="40" max="180" value="60" step="5">
              <span id="bpm-value" class="bpm-badge">60 BPM</span>
            </div>
            <p class="setting-hint">60 BPM = 1 detik bunyi setiap saat untuk panduan ritma lompatan.</p>
          </div>
        </div>

        <div class="modal-footer">
          <button id="save-settings-btn" class="btn btn-primary">Simpan & Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
