<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JumpXMan - Pengira Lompatan AI & Deteksi 5 Jari</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="icon">🏃</span>
        <h1>JumpXMan <span class="badge">AI Pose</span></h1>
      </div>
      <button id="pwa-install-btn" class="btn-install" style="display:none;">📱 Pasang App</button>
    </header>

    <main class="viewport-section">
      <div class="video-wrapper">
        <video id="webcam" playsinline style="display:none;"></video>
        <canvas id="output_canvas"></canvas>

        <div class="hud-overlay">
          <div class="stat-card count-card">
            <span class="label">LOMPATAN</span>
            <span id="jump-count" class="value">0</span>
          </div>
          <div class="stat-card status-card">
            <span class="label">STATUS</span>
            <span id="jump-status" class="status-badge ready">SEDIA</span>
          </div>
        </div>

        <div class="jump-meter-container">
          <div id="jump-meter-bar" class="jump-meter-bar"></div>
        </div>

        <div id="calibration-msg" class="calibration-overlay">
          <p>🧍 Pastikan badan dan tangan kelihatan di kamera.</p>
        </div>
      </div>
    </main>

    <section class="controls-panel">
      <div class="btn-group">
        <button id="start-btn" class="btn btn-primary">▶️ Mula Kamera</button>
        <button id="reset-btn" class="btn btn-danger">🔄 Semula</button>
      </div>

      <div class="control-row">
        <label for="camera-select" class="input-label">📷 Kamera:</label>
        <select id="camera-select" class="select-input">
          <option value="">Memuatkan kamera...</option>
        </select>
      </div>

      <div class="control-row">
        <label for="sensitivity-select" class="input-label">⚡ Kepekaan:</label>
        <select id="sensitivity-select" class="select-input">
          <option value="high">Tinggi (Lompatan Kecil)</option>
          <option value="medium" selected>Sederhana (Disyorkan)</option>
          <option value="low">Rendah (Lompatan Tinggi)</option>
        </select>
      </div>

      <div class="toggle-group">
        <label class="toggle-switch">
          <input type="checkbox" id="skeleton-toggle" checked>
          <span class="slider"></span>
          <span class="toggle-label">Skeleton & 5 Jari</span>
        </label>

        <label class="toggle-switch">
          <input type="checkbox" id="sound-toggle" checked>
          <span class="slider"></span>
          <span class="toggle-label">Bunyi</span>
        </label>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
